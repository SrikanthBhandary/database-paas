<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TigerData PaaS Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = 'http://localhost:8000/v1';

    function App() {
      const [ownerId, setOwnerId] = useState('org-engineering-01');
      const [databases, setDatabases] = useState([]);
      const [view, setView] = useState('list');
      const [selectedDbId, setSelectedDbId] = useState(null);
      const [notification, setNotification] = useState(null);

      useEffect(() => {
        fetchDatabases();
        const interval = setInterval(fetchDatabases, 4000);
        return () => clearInterval(interval);
      }, [ownerId]);

      const notify = (msg, type = 'info') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 4000);
      };

      const fetchDatabases = async () => {
        try {
          const res = await fetch(`${API_BASE}/databases`, {
            headers: { 'X-Owner-ID': ownerId }
          });
          if (res.ok) {
            const data = await res.json();
            setDatabases(data.databases || []);
          }
        } catch (err) {
          console.error("Failed to connect to backend", err);
        }
      };

      const activeDb = databases.find(d => d.id === selectedDbId);

      return (
        <div className="flex flex-col min-h-screen bg-slate-950 text-slate-100">
          <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('list')}>
                <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-bold text-lg text-white shadow-lg shadow-cyan-500/20">
                  <i className="fa-solid fa-database text-sm"></i>
                </div>
                <span className="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                  TigerData <span className="text-xs font-semibold px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-800/50 ml-1">PaaS</span>
                </span>
              </div>

              <div className="flex items-center space-x-4">
                <div className="flex items-center space-x-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-400">
                  <i className="fa-solid fa-user-shield text-slate-500"></i>
                  <span>X-Owner-ID:</span>
                  <input
                    type="text"
                    value={ownerId}
                    onChange={(e) => setOwnerId(e.target.value)}
                    className="bg-transparent border-none text-slate-200 font-mono text-xs focus:outline-none w-36"
                  />
                </div>
                <button
                  onClick={() => setView('create')}
                  className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-xs transition flex items-center space-x-2 shadow-lg shadow-cyan-500/10"
                >
                  <i className="fa-solid fa-plus"></i>
                  <span>Provision Database</span>
                </button>
              </div>
            </div>
          </header>

          {notification && (
            <div className={`fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-2xl border text-sm flex items-center space-x-3 z-50 ${
              notification.type === 'error' ? 'bg-red-950/90 border-red-800 text-red-200' : 'bg-slate-900 border-cyan-500/30 text-cyan-200'
            }`}>
              <i className={`fa-solid ${notification.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info'}`}></i>
              <span>{notification.msg}</span>
            </div>
          )}

          <main className="flex-1 max-w-7xl w-full mx-auto p-6">
            {view === 'list' && (
              <DatabaseList
                databases={databases}
                onSelect={(db) => { setSelectedDbId(db.id); setView('details'); }}
                onCreate={() => setView('create')}
              />
            )}
            {view === 'create' && (
              <CreateDatabaseForm
                ownerId={ownerId}
                onCreated={() => { setView('list'); fetchDatabases(); notify("Provisioning request dispatched!", "success"); }}
                onCancel={() => setView('list')}
                notify={notify}
              />
            )}
            {view === 'details' && activeDb && (
              <DatabaseDetails
                db={activeDb}
                ownerId={ownerId}
                onBack={() => setView('list')}
                onRefresh={fetchDatabases}
                notify={notify}
              />
            )}
          </main>
        </div>
      );
    }

    function DatabaseList({ databases, onSelect, onCreate }) {
      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-xl font-bold tracking-tight text-white">Managed Instances</h1>
              <p className="text-xs text-slate-400 mt-1">Real-time state and metrics across active deployments</p>
            </div>
            <div className="text-xs text-slate-400 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg">
              Total Instances: <span className="font-semibold text-white">{databases.length}</span>
            </div>
          </div>

          {databases.length === 0 ? (
            <div className="border border-dashed border-slate-800 rounded-xl p-12 text-center bg-slate-900/30">
              <i className="fa-solid fa-server text-3xl text-slate-600 mb-3"></i>
              <h3 className="text-sm font-semibold text-slate-300">No databases found</h3>
              <p className="text-xs text-slate-500 mt-1 mb-4">Get started by provisioning a new managed database instance.</p>
              <button onClick={onCreate} className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-4 py-2 rounded-lg text-xs font-semibold transition">
                Provision Database
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {databases.map(db => (
                <div
                  key={db.id}
                  onClick={() => onSelect(db)}
                  className="bg-slate-900 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition cursor-pointer group flex flex-col justify-between hover:shadow-xl hover:shadow-cyan-950/20"
                >
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <span className="font-semibold text-sm text-slate-200 group-hover:text-cyan-400 transition">{db.name}</span>
                      <StatusBadge status={db.status} />
                    </div>
                    <p className="text-xs text-slate-400 line-clamp-2 mb-4 font-mono">{db.id}</p>
                  </div>

                  <div className="space-y-2 border-t border-slate-800/80 pt-3 text-xs text-slate-400">
                    <div className="flex justify-between">
                      <span>Engine:</span>
                      <span className="font-medium text-slate-300 capitalize">{db.engine || 'postgres'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Plan:</span>
                      <span className="font-medium text-slate-300 capitalize">{db.plan || 'small'}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function CreateDatabaseForm({ ownerId, onCreated, onCancel, notify }) {
      const [name, setName] = useState('');
      const [engine, setEngine] = useState('postgres');
      const [plan, setPlan] = useState('small');
      const replicas = 1;
      const version = "17";
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const res = await fetch(`${API_BASE}/databases`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Owner-ID': ownerId
            },
            body: JSON.stringify({ name, engine, plan,replicas, version })
          });
          if (res.ok) {
            onCreated();
          } else {
            notify("Failed to provision instance", "error");
          }
        } catch (err) {
          notify("Network error connecting to control plane", "error");
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-xl p-6">
          <h2 className="text-lg font-bold text-white mb-1">Provision Managed Database</h2>
          <p className="text-xs text-slate-400 mb-6">Configure runtime engine parameters and service plan.</p>

          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Database Name</label>
              <input
                type="text"
                required
                value={name}
                onChange={(e) => setName(e.target.value)}
                placeholder="e.g. order1"
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
              />
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Engine</label>
              <select
                value={engine}
                onChange={(e) => setEngine(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
              >
                <option value="postgres">PostgreSQL 16</option>
                <option value="mysql">MySQL 8.0</option>
                <option value="redis">Redis Cluster</option>
              </select>
            </div>

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Instance Plan</label>
              <select
                value={plan}
                onChange={(e) => setPlan(e.target.value)}
                className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500"
              >
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
              </select>
            </div>

            <div className="flex items-center justify-end space-x-3 pt-4 border-t border-slate-800">
              <button
                type="button"
                onClick={onCancel}
                className="px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition"
              >
                Cancel
              </button>
              <button
                type="submit"
                disabled={submitting}
                className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-xs transition flex items-center space-x-2"
              >
                {submitting && <i className="fa-solid fa-spinner fa-spin"></i>}
                <span>Deploy Database</span>
              </button>
            </div>
          </form>
        </div>
      );
    }

    function DatabaseDetails({ db, ownerId, onBack, onRefresh, notify }) {
      const [plan, setPlan] = useState(db.plan || 'small');
      const [updating, setUpdating] = useState(false);

      const handleScale = async () => {
        setUpdating(true);
        try {
          const res = await fetch(`${API_BASE}/databases/${db.id}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'X-Owner-ID': ownerId
            },
            body: JSON.stringify({ plan })
          });
          if (res.ok) {
            notify("Plan update request applied", "success");
            onRefresh();
          } else {
            notify("Failed to update plan", "error");
          }
        } catch (err) {
          notify("Error executing plan update request", "error");
        } finally {
          setUpdating(false);
        }
      };

      const handleDelete = async () => {
        if (!confirm("Are you sure you want to deprovision this database?")) return;
        try {
          const res = await fetch(`${API_BASE}/databases/${db.id}`, {
            method: 'DELETE',
            headers: { 'X-Owner-ID': ownerId }
          });
          if (res.ok) {
            notify("Database deleted", "info");
            onBack();
            onRefresh();
          } else {
            notify("Failed to delete database", "error");
          }
        } catch (err) {
          notify("Error sending delete request", "error");
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center space-x-4">
            <button onClick={onBack} className="text-slate-400 hover:text-white transition text-xs flex items-center space-x-1">
              <i className="fa-solid fa-arrow-left"></i>
              <span>Back to instances</span>
            </button>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <div className="flex items-start justify-between mb-6">
              <div>
                <div className="flex items-center space-x-3">
                  <h1 className="text-xl font-bold text-white">{db.name}</h1>
                  <StatusBadge status={db.status} />
                </div>
                <p className="text-xs font-mono text-slate-400 mt-1">{db.id}</p>
              </div>
              <button
                onClick={handleDelete}
                className="bg-red-950/50 hover:bg-red-900/50 text-red-400 border border-red-800/50 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center space-x-2"
              >
                <i className="fa-solid fa-trash"></i>
                <span>Deprovision</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 border-t border-b border-slate-800 py-6 mb-6">
              <div>
                <span className="text-xs text-slate-500 block mb-1">Engine Version</span>
                <span className="text-sm font-semibold text-slate-200 capitalize">{db.engine || 'postgres'}</span>
              </div>
              <div>
                <span className="text-xs text-slate-500 block mb-1">Created At</span>
                <span className="text-sm font-semibold text-slate-200">{db.created_at || 'Just now'}</span>
              </div>
              <div>
                <span className="text-xs text-slate-500 block mb-1">Current Plan</span>
                <span className="text-sm font-semibold text-slate-200 capitalize">{db.plan || 'small'}</span>
              </div>
            </div>

            <div className="max-w-md">
              <h3 className="text-xs font-semibold text-slate-300 mb-2">Change Instance Plan</h3>
              <div className="flex items-center space-x-3">
                <select
                  value={plan}
                  onChange={(e) => setPlan(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 w-36"
                >
                  <option value="small">Small</option>
                  <option value="medium">Medium</option>
                  <option value="large">Large</option>
                </select>
                <button
                  onClick={handleScale}
                  disabled={updating}
                  className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-4 py-2 rounded-lg text-xs transition flex items-center space-x-2"
                >
                  {updating && <i className="fa-solid fa-spinner fa-spin"></i>}
                  <span>Apply Plan Update</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function StatusBadge({ status }) {
      const isReady = status === 'ready' || status === 'active';
      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium border ${
          isReady
            ? 'bg-emerald-950 text-emerald-400 border-emerald-800/50'
            : 'bg-amber-950 text-amber-400 border-amber-800/50 animate-pulse'
        }`}>
          <span className={`w-1.5 h-1.5 rounded-full mr-1.5 ${isReady ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
          {status || 'initializing'}
        </span>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
