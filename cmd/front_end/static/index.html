<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database console</title>
<script>
  // Apply the saved (or OS) theme before first paint to avoid a flash.
  try {
    var t = localStorage.getItem('console.theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef2f6;
  --panel: #ffffff;
  --sunk: #f5f7fa;
  --line: #dbe2ea;
  --line-strong: #c3cfdb;
  --ink: #12263a;
  --muted: #566779;
  --faint: #8494a5;
  --accent: #0a7f8f;
  --accent-hover: #086c7a;
  --accent-ink: #ffffff;
  --accent-soft: rgba(10, 127, 143, .10);
  --ok: #1d8458;
  --ok-soft: rgba(29, 132, 88, .12);
  --busy: #2f62c9;
  --busy-soft: rgba(47, 98, 201, .12);
  --warn: #9a6300;
  --warn-soft: rgba(201, 138, 11, .16);
  --bad: #c13838;
  --bad-soft: rgba(193, 56, 56, .11);
  --glow: rgba(10, 127, 143, .07);
  --pop: 0 16px 40px rgba(18, 38, 58, .22);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0c151e;
  --panel: #121e2a;
  --sunk: #0e1822;
  --line: #213245;
  --line-strong: #2f4660;
  --ink: #dde7f1;
  --muted: #98a9bb;
  --faint: #67798c;
  --accent: #3cbccb;
  --accent-hover: #5fcfdc;
  --accent-ink: #06222a;
  --accent-soft: rgba(60, 188, 203, .13);
  --ok: #43c08b;
  --ok-soft: rgba(67, 192, 139, .14);
  --busy: #6f9bf0;
  --busy-soft: rgba(111, 155, 240, .15);
  --warn: #e0a93a;
  --warn-soft: rgba(224, 169, 58, .15);
  --bad: #f07272;
  --bad-soft: rgba(240, 114, 114, .14);
  --glow: rgba(60, 188, 203, .08);
  --pop: 0 16px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: radial-gradient(1100px 380px at 50% -160px, var(--glow), transparent), var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 14px/1.5 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav a { padding: 6px 10px; border-radius: 6px; color: var(--muted); font-weight: 500; }
.nav a.active { color: var(--ink); background: var(--accent-soft); }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.owner-btn { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; font-size: 12px; max-width: 220px; }
.owner-btn:hover { border-color: var(--line-strong); }
.owner-btn .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none; }

/* ---------- layout ---------- */
.container { max-width: 1240px; margin: 0 auto; padding: 28px 24px 72px; }
.crumbs { display: flex; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs span[aria-hidden] { color: var(--faint); }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
.page-head .sub { color: var(--muted); margin-top: 4px; max-width: 62ch; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.id-row { display: flex; align-items: center; gap: 4px; color: var(--muted); margin-top: 4px; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel); font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(.93); border-color: var(--bad); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: transparent; background: var(--accent-soft); }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--ink); background: var(--accent-soft); }

.input, .select { width: 100%; height: 36px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--panel); }
.input:hover, .select:hover { border-color: var(--muted); }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.input-affix { position: relative; }
.input-affix .input { padding-right: 38px; }
.input-affix span { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 12px; pointer-events: none; }
.field { display: grid; gap: 6px; }
.field > label, .field-label { font-weight: 500; font-size: 13px; }
.field-hint { color: var(--muted); font-size: 12.5px; }
.field-err { color: var(--bad); font-size: 12.5px; }

.toggle { width: 38px; height: 22px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--sunk); position: relative; cursor: pointer; padding: 0; flex: none; }
.toggle span { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--faint); transition: transform .15s, background .15s; }
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on span { transform: translateX(16px); background: var(--accent-ink); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.switch-row p { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

.slider-row { display: flex; align-items: center; gap: 14px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--accent); height: 22px; }
.slider-val { min-width: 84px; text-align: right; font-weight: 500; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 7px; overflow: hidden; background: var(--panel); }
.stepper button { width: 34px; height: 34px; border: 0; background: transparent; cursor: pointer; font-size: 16px; color: var(--muted); }
.stepper button:hover:not(:disabled) { background: var(--accent-soft); color: var(--ink); }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { min-width: 44px; text-align: center; font-weight: 500; border-inline: 1px solid var(--line); line-height: 34px; }

/* ---------- status ---------- */
.badge { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge.ok { color: var(--ok); background: var(--ok-soft); }
.badge.busy { color: var(--busy); background: var(--busy-soft); }
.badge.warn { color: var(--warn); background: var(--warn-soft); }
.badge.bad { color: var(--bad); background: var(--bad-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; flex: none; }
.dot.ok { color: var(--ok); } .dot.busy { color: var(--busy); } .dot.bad { color: var(--bad); } .dot.warn { color: var(--warn); } .dot.idle { color: var(--faint); }
.dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
.spin { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- fleet bar ---------- */
.fleet { margin-bottom: 22px; }
.fleet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.fleet-head h2 { font-size: 15px; font-weight: 600; }
.fleet-bar { display: flex; gap: 3px; height: 12px; }
.seg { border-radius: 4px; min-width: 6px; }
.seg.ok { background: var(--ok); } .seg.busy { background: var(--busy); } .seg.bad { background: var(--bad); }
.seg.empty { background: var(--line); }
.fleet-legend { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.fleet-legend button { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted); }
.fleet-legend button:hover { background: var(--accent-soft); }
.fleet-legend button[aria-pressed="true"] { border-color: var(--line-strong); background: var(--panel); color: var(--ink); }
.fleet-legend strong { color: var(--ink); font-weight: 600; }

/* ---------- table ---------- */
.toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search .input { padding-left: 34px; }
.table-wrap { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; min-width: 820px; }
.table th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.table td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr { cursor: pointer; }
.table tbody tr:hover { background: var(--accent-soft); }
.table tbody tr:focus-visible { outline-offset: -2px; }
.cell-name { font-weight: 600; }
.cell-sub { color: var(--muted); font-size: 12.5px; }
.skel { display: block; height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--line), var(--sunk), var(--line)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

.empty { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 48px 24px; text-align: center; background: var(--panel); }
.empty h3 { font-size: 16px; font-weight: 600; }
.empty p { color: var(--muted); margin: 6px auto 18px; max-width: 46ch; }

/* ---------- banners ---------- */
.banner { display: flex; gap: 12px; padding: 12px 14px; border-radius: 8px; border: 1px solid; margin-bottom: 18px; align-items: flex-start; }
.banner svg { flex: none; margin-top: 2px; }
.banner strong { display: block; font-weight: 600; }
.banner p { margin-top: 2px; }
.banner.bad { color: var(--bad); background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
.banner.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.info { color: var(--busy); background: var(--busy-soft); border-color: color-mix(in srgb, var(--busy) 35%, transparent); }
.banner .banner-body { color: var(--ink); flex: 1; }
.banner .banner-body strong { color: inherit; }
.banner.bad strong { color: var(--bad); } .banner.warn strong { color: var(--warn); } .banner.info strong { color: var(--busy); }

/* ---------- detail ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
.tabs button { padding: 10px 14px; border: 0; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.section { padding: 0 0 26px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.section:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.section h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.section > .lede { color: var(--muted); margin-bottom: 16px; max-width: 68ch; }
.rail { position: sticky; top: 80px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 6px 18px; }
.facts > div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.facts > div:last-child { border-bottom: 0; }
.facts dt { color: var(--muted); }
.facts dd { text-align: right; font-weight: 500; overflow-wrap: anywhere; }

.meter-row { display: grid; grid-template-columns: 110px 1fr 150px; gap: 16px; align-items: center; padding: 9px 0; }
.meter-row .name { color: var(--muted); }
.meter { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.meter-row .val { text-align: right; font-weight: 500; }
.meter-note { color: var(--faint); font-size: 12.5px; margin-top: 4px; }

.steps { display: flex; gap: 0; margin: 4px 0 4px; }
.step { flex: 1; display: grid; gap: 8px; position: relative; padding-right: 8px; }
.step::before { content: ''; position: absolute; top: 11px; left: 24px; right: 0; height: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step.done::before { background: var(--accent); }
.step-dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--panel); display: grid; place-items: center; position: relative; z-index: 1; color: var(--accent-ink); }
.step.done .step-dot { background: var(--accent); border-color: var(--accent); }
.step.now .step-dot { border-color: var(--accent); }
.step.now .step-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.step span.label { color: var(--muted); font-size: 13px; }
.step.now span.label, .step.done span.label { color: var(--ink); font-weight: 500; }

.kv { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.kv:first-of-type { border-top: 1px solid var(--line); }
.kv .k { color: var(--muted); }
.kv .v { overflow-wrap: anywhere; font-weight: 500; }
.codebox { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 10px 8px 10px 14px; overflow-x: auto; }
.codebox code { flex: 1; white-space: nowrap; }

/* ---------- create ---------- */
.form-split { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
.form-sec { padding-bottom: 28px; margin-bottom: 28px; border-bottom: 1px solid var(--line); display: grid; gap: 16px; }
.form-sec:last-of-type { border-bottom: 0; }
.form-sec > h2 { font-size: 15px; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.choice, .plan { text-align: left; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--panel); cursor: pointer; display: grid; gap: 2px; }
.choice:hover:not(:disabled), .plan:hover { border-color: var(--muted); }
.choice[aria-checked="true"], .plan[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.choice:disabled { opacity: .55; cursor: not-allowed; background: var(--sunk); }
.choice .t, .plan .t { font-weight: 600; }
.plan .s { color: var(--muted); font-size: 12.5px; }
.summary { position: sticky; top: 80px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 18px; }
.summary h2 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
.summary .facts { margin-bottom: 14px; }
.summary .btn { width: 100%; }
.sum-note { color: var(--muted); font-size: 12.5px; margin-top: 12px; }
.form-actions { display: flex; gap: 10px; margin-top: 8px; }

/* ---------- modal / toast ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 18, 28, .55); display: grid; place-items: center; padding: 20px; z-index: 100; animation: fade .12s ease-out; }
.modal { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--pop); animation: rise .16s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 0 20px; }
.modal-head h2 { font-size: 16px; font-weight: 600; }
.modal-body { padding: 12px 20px 20px; display: grid; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--sunk); border-radius: 0 0 12px 12px; }
.change-list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.change-list li { display: flex; justify-content: space-between; gap: 16px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.change-list li:last-child { border-bottom: 0; }
.change-list .from { color: var(--muted); text-decoration: line-through; margin-right: 8px; }
.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 10px; z-index: 120; width: min(380px, calc(100vw - 40px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 9px; background: var(--ink); color: var(--bg); box-shadow: var(--pop); animation: rise .18s ease-out; }
.toast.error { background: var(--bad); color: #fff; }
.toast.success { background: var(--ok); color: #fff; }
.toast p { flex: 1; }
.toast button { background: none; border: 0; color: inherit; opacity: .8; cursor: pointer; padding: 0; }

.danger { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); border-radius: 10px; padding: 18px 20px; display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.danger h3 { font-weight: 600; }
.danger p { color: var(--muted); max-width: 60ch; margin-top: 2px; }
.inline-list { margin: 8px 0 0 18px; list-style: disc; }

@media (max-width: 940px) {
  .split, .form-split { grid-template-columns: 1fr; gap: 28px; }
  .rail, .summary { position: static; }
  .plans { grid-template-columns: 1fr; }
  .nav, .pill { display: none; }
  .meter-row { grid-template-columns: 90px 1fr; }
  .meter-row .val { grid-column: 1 / -1; text-align: left; }
  .kv { grid-template-columns: 1fr auto; }
  .kv .k { grid-column: 1 / -1; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* =====================================================================
   Configuration
   ===================================================================== */
const BRAND = { name: 'DB Cloud' };           // change the product name here
const DEFAULT_API = 'http://localhost:8000/v1';

// Mirrors pkg/service/plans.go. The server is the source of truth: anything
// that disagrees is rejected there and shown inline as a field error.
const PLANS = {

function progressFor(status) {
  switch (status) {
    case 'pending':        return { steps: ['Queued', 'Provisioning', 'Available'], at: 0 };
    case 'provisioning':   return { steps: ['Queued', 'Provisioning', 'Available'], at: 1 };
    case 'update_pending': return { steps: ['Queued', 'Applying changes', 'Available'], at: 0 };
    case 'updating':       return { steps: ['Queued', 'Applying changes', 'Available'], at: 1 };
    case 'delete_pending': return { steps: ['Queued', 'Removing resources', 'Deleted'], at: 0 };

function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 86400 * 30) return `${Math.round(s / 86400)} d ago`;
  return new Date(iso).toLocaleDateString();
}
const fullDate = (iso) => (iso ? new Date(iso).toLocaleString() : '');

function describeCron(cron) {
  const p = CRON_PRESETS.find((x) => x.cron === cron);
  return p ? p.label : `Cron ${cron} (UTC)`;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch { return false; }
  }
}

/* =====================================================================
   API client
   ===================================================================== */
class ApiError extends Error {
  constructor(status, message, fields) {
    super(message);
    this.status = status;
    this.fields = fields || {};
  }
}

function makeRequest(base, owner) {
  const root = base.replace(/\/+$/, '');
  return async function request(path, { method = 'GET', body } = {}) {
    let res;
    try {
      res = await fetch(root + path, {
        method,
        headers: {
          'X-Owner-ID': owner,
          ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}),
        },
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new ApiError(0, `Cannot reach the control plane at ${root}`);
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON body */ }
    if (!res.ok) {
      throw new ApiError(res.status, (data && (data.detail || data.title)) || res.statusText, data && data.errors);
    }
    return data;
  };
}

function useStored(key, initial) {
  const [value, setValue] = useState(() => {
    try { const s = localStorage.getItem(key); return s === null ? initial : s; } catch { return initial; }
  });
  const set = useCallback((v) => {
    setValue(v);
    try { localStorage.setItem(key, v); } catch { /* storage unavailable */ }
  }, [key]);
  return [value, set];
}

function useDatabases(request) {
  const [state, setState] = useState({ items: [], loaded: false, error: null });
  const seq = useRef(0);

  const load = useCallback(async () => {
    const id = ++seq.current;
    try {
      const data = await request('/databases');
      if (id !== seq.current) return;
      setState({ items: (data && data.databases) || [], loaded: true, error: null });
    } catch (e) {
      if (id !== seq.current) return;
      setState((s) => ({ ...s, loaded: true, error: e }));
    }
  }, [request]);

  useEffect(() => {
    setState({ items: [], loaded: false, error: null });
    load();
    const timer = setInterval(() => { if (!document.hidden) load(); }, 4000);
    const onVisible = () => { if (!document.hidden) load(); };
    document.addEventListener('visibilitychange', onVisible);
    return () => {
      clearInterval(timer);
      document.removeEventListener('visibilitychange', onVisible);
      seq.current++;
    };
  }, [load]);

  return { ...state, refresh: load };
}

function useToasts() {
  const [items, setItems] = useState([]);
  const counter = useRef(0);
  const dismiss = useCallback((id) => setItems((s) => s.filter((t) => t.id !== id)), []);
  const notify = useCallback((msg, type = 'info') => {
    const id = ++counter.current;
    setItems((s) => [...s, { id, msg, type }]);
    setTimeout(() => dismiss(id), 5500);
  }, [dismiss]);
  return { items, notify, dismiss };
}

function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'databases') {
    if (parts[1] === 'new') return { name: 'new' };
    if (parts[1]) return { name: 'detail', id: decodeURIComponent(parts[1]) };
  }
  return { name: 'list' };
}
function useRoute() {
  const [route, setRoute] = useState(parseHash);
  useEffect(() => {
    const on = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  return route;
}

    items.forEach((d) => { c[statusOf(d.status).group] += 1; });
    return c;
  }, [items]);

  const rows = useMemo(() => {
    const needle = q.trim().toLowerCase();

      (filter === 'all' || statusOf(d.status).group === filter) &&
      (!needle || d.name.toLowerCase().includes(needle) || d.id.toLowerCase().startsWith(needle)));
  }, [items, q, filter]);

        <div className="empty">

        <div className="table-wrap">

            </tr></thead>
            <tbody>

              ))}

                  <td>{fmtGb(db.resources.storage_gb)}</td>

  const plan = PLANS[f.plan];
  const set = (patch) => setF((s) => ({ ...s, ...patch }));
  const cron = f.preset === 'custom' ? f.cron : CRON_PRESETS.find((p) => p.id === f.preset).cron;
  const nameBad = f.name !== '' && !NAME_RE.test(f.name);

  const pickPlan = (key) => {
    const p = PLANS[key];
    setF((s) => ({ ...s, plan: key, replicas: Math.min(s.replicas, p.maxReplicas), retention: Math.min(s.retention, p.maxRetention) }));
    setErrs({});
  };
  const pickEngine = (key) => set({ engine: key, version: ENGINES[key].versions[0] });

  const submit = async (e) => {
    e.preventDefault();
    const local = {};
    if (!NAME_RE.test(f.name)) local.name = 'Use lowercase letters, digits and hyphens. Start with a letter and keep it under 41 characters.';
    if (f.autoscale && !f.autoscaleMax) local['autoscale.max_storage_gb'] = 'Enter the largest size storage may grow to.';
    if (Object.keys(local).length) { setErrs(local); return; }

    const body = {
      name: f.name, engine: f.engine, version: f.version, plan: f.plan, replicas: Number(f.replicas),
      backup: f.backup
        ? { enabled: true, schedule: cron.trim(), retention_days: Number(f.retention) }
        : { enabled: false, schedule: '', retention_days: 0 },
    };
    if (f.storage !== '') body.storage_gb = Number(f.storage);
    if (f.autoscale) body.autoscale = { enabled: true, max_storage_gb: Number(f.autoscaleMax) };

    setBusy(true); setErrs({});
    try {
      const db = await request('/databases', { method: 'POST', body });
      notify(`Creating ${db.name}. This takes a few minutes.`, 'success');
      await refresh();
      go('#/databases/' + db.id);
    } catch (err) {
      if (err.status === 400 && Object.keys(err.fields).length) setErrs(err.fields);
      else if (err.status === 409) setErrs({ name: 'You already have a database with this name.' });
      else setErrs({ _form: err.message });
    } finally { setBusy(false); }
  };

  const unmapped = Object.entries(errs).filter(([k]) => !CREATE_KEYS.includes(k));
  const storageShown = f.storage !== '' ? Number(f.storage) : plan.storage;

  return (
    <>
      <PageHead crumbs={[{ label: 'Databases', href: '#/databases' }, { label: 'Create database' }]}
                title="Create database" sub="Choose an engine and a size. You can resize it later." />
      {unmapped.length > 0 && (
        <Banner tone="bad" title="The request was rejected">
          {unmapped.map(([k, v]) => (k === '_form' ? v : `${k.replace(/_/g, ' ')}: ${v}`)).join('. ')}
        </Banner>
      )}
      <form className="form-split" onSubmit={submit} noValidate>
        <div>
          <section className="form-sec">
            <h2>Database</h2>
            <Field label="Name" htmlFor="f-name" error={errs.name}
                   hint={nameBad ? undefined : 'Lowercase letters, digits and hyphens. This becomes part of the hostname and cannot be changed.'}>
              <input id="f-name" className="input mono" value={f.name} placeholder="orders" maxLength={40} aria-invalid={!!(errs.name || nameBad)}
                     onChange={(e) => set({ name: e.target.value })} autoFocus />
              {nameBad && !errs.name && <p className="field-err">Start with a lowercase letter and use only lowercase letters, digits and hyphens. Do not end with a hyphen.</p>}
            </Field>
            <div className="field">
              <span className="field-label">Engine</span>
              <div className="choices" role="radiogroup" aria-label="Engine">
                {Object.entries(ENGINES).map(([key, en]) => (
                  <button type="button" key={key} role="radio" aria-checked={f.engine === key} className="choice"
                          disabled={!en.available} onClick={() => pickEngine(key)}>
                    <span className="t">{en.label}</span>
                    <span className="s muted">{en.available ? 'Managed, with automatic failover' : 'Not available yet'}</span>
                  </button>
                ))}
              </div>
              {errs.engine && <p className="field-err" role="alert">{errs.engine}</p>}
            </div>
            <Field label="Version" htmlFor="f-version" error={errs.version}>
              <select id="f-version" className="select" style={{ maxWidth: 200 }} value={f.version} onChange={(e) => set({ version: e.target.value })}>
                {ENGINES[f.engine].versions.map((v) => <option key={v} value={v}>{ENGINES[f.engine].label} {v}</option>)}
              </select>
            </Field>
          </section>

          <section className="form-sec">
            <h2>Size</h2>
            <div className="field">
              <span className="field-label">Plan</span>
              <PlanPicker value={f.plan} onChange={pickPlan} />
              {errs.plan && <p className="field-err" role="alert">{errs.plan}</p>}
            </div>
            <div className="row2">
              <Field label="Instances" error={errs.replicas}
                     hint={f.replicas === 1 ? 'A single instance has no standby. Maintenance and failures cause downtime.'
                                            : `One primary and ${f.replicas - 1} ${f.replicas === 2 ? 'standby' : 'standbys'} with automatic failover.`}>
                <Stepper value={f.replicas} min={1} max={plan.maxReplicas} label="instances" onChange={(v) => set({ replicas: v })} />
              </Field>
              <Field label="Storage" htmlFor="f-storage" error={errs.storage_gb}
                     hint={`Defaults to ${plan.storage} GB. Up to ${plan.maxStorage} GB on ${plan.label}. Storage can grow but not shrink.`}>
                <div className="input-affix">
                  <input id="f-storage" type="number" className="input" min={plan.storage} max={plan.maxStorage} placeholder={String(plan.storage)}
                         value={f.storage} onChange={(e) => set({ storage: e.target.value })} aria-invalid={!!errs.storage_gb} />
                  <span>GB</span>
                </div>
              </Field>
            </div>
            <div className="switch-row">
              <div><div className="field-label">Grow storage automatically</div><p>Increase the volume as it fills, up to a limit you set.</p></div>
              <Toggle checked={f.autoscale} onChange={(v) => set({ autoscale: v })} label="Grow storage automatically" />
            </div>
            {f.autoscale && (
              <Field label="Maximum storage" htmlFor="f-asmax" error={errs['autoscale.max_storage_gb']}
                     hint={`Must be larger than ${storageShown} GB and at most ${plan.maxStorage} GB.`}>
                <div className="input-affix" style={{ maxWidth: 240 }}>
                  <input id="f-asmax" type="number" className="input" min={storageShown + 1} max={plan.maxStorage}
                         value={f.autoscaleMax} onChange={(e) => set({ autoscaleMax: e.target.value })} aria-invalid={!!errs['autoscale.max_storage_gb']} />
                  <span>GB</span>
                </div>
              </Field>
            )}
          </section>

          <section className="form-sec">
            <h2>Backups</h2>
            <div className="switch-row">
              <div><div className="field-label">Scheduled backups</div><p>Back up on a schedule and keep point-in-time recovery data.</p></div>
              <Toggle checked={f.backup} onChange={(v) => set({ backup: v })} label="Scheduled backups" />
            </div>
            {f.backup && (
              <>
                <div className="row2">
                  <Field label="Schedule" htmlFor="f-preset" error={f.preset !== 'custom' ? errs['backup.schedule'] : undefined}>
                    <select id="f-preset" className="select" value={f.preset} onChange={(e) => set({ preset: e.target.value })}>
                      {CRON_PRESETS.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
                    </select>
                  </Field>
                  <Field label="Keep backups for" htmlFor="f-ret" error={errs['backup.retention_days']} hint={`Up to ${plan.maxRetention} days on ${plan.label}.`}>
                    <div className="input-affix">
                      <input id="f-ret" type="number" className="input" min={1} max={plan.maxRetention} value={f.retention}
                             onChange={(e) => set({ retention: e.target.value })} aria-invalid={!!errs['backup.retention_days']} />
                      <span>days</span>
                    </div>
                  </Field>
                </div>
                {f.preset === 'custom' && (
                  <Field label="Cron expression" htmlFor="f-cron" error={errs['backup.schedule']}
                         hint="Five fields, in UTC. Backups can run at most once an hour.">
                    <input id="f-cron" className="input mono" value={f.cron} onChange={(e) => set({ cron: e.target.value })} aria-invalid={!!errs['backup.schedule']} />
                  </Field>
                )}
              </>
            )}
          </section>
        </div>

        <aside className="summary" aria-label="Summary">
          <h2>Summary</h2>
          <dl className="facts">
            <div><dt>Name</dt><dd className="mono">{f.name || 'not set'}</dd></div>
            <div><dt>Engine</dt><dd>{ENGINES[f.engine].label} {f.version}</dd></div>
            <div><dt>Plan</dt><dd>{plan.label}</dd></div>
            <div><dt>Compute</dt><dd>{fmtCpu(plan.cpu)}, {fmtMem(plan.mem)}</dd></div>
            <div><dt>Storage</dt><dd>{storageShown} GB{f.autoscale && f.autoscaleMax ? `, up to ${f.autoscaleMax} GB` : ''}</dd></div>
            <div><dt>Instances</dt><dd>{f.replicas}</dd></div>
            <div><dt>Backups</dt><dd>{f.backup ? `${f.retention} day retention` : 'Off'}</dd></div>
          </dl>
          <button className="btn btn-primary" type="submit" disabled={busy}>{busy && <Icon name="loader" />}Create database</button>
          <button className="btn btn-ghost" type="button" style={{ marginTop: 6 }} onClick={() => go('#/databases')}>Cancel</button>
          <p className="sum-note">Your database is queued, provisioned, then marked Available. Connection details appear when it is ready.</p>
        </aside>
      </form>
    </>
  );
}

/* =====================================================================
   Database detail
   ===================================================================== */
function Progress({ status }) {
  const p = progressFor(status);
  if (!p) return null;
  return (
    <section className="section" aria-label="Progress">
      <ol className="steps">
        {p.steps.map((label, i) => (
          <li key={label} className={`step ${i < p.at ? 'done' : i === p.at ? 'now' : ''}`}>
            <span className="step-dot">{i < p.at ? <Icon name="check" size={12} /> : i === p.at ? <i /> : null}</span>
            <span className="label">{label}</span>
          </li>
        ))}
      </ol>
    </section>
  );
}

function Meter({ name, value, max, text, note }) {
  const pct = max ? Math.min(100, (value / max) * 100) : 0;
  return (
    <div>
      <div className="meter-row">
        <span className="name">{name}</span>
        <div className="meter" role="img" aria-label={`${name}: ${text}`}><i style={{ width: `${pct}%` }} /></div>
        <span className="val">{text}</span>
      </div>
      {note && <p className="meter-note" style={{ marginLeft: 126 }}>{note}</p>}
    </div>
  );
}

function OverviewTab({ db }) {
  const plan = PLANS[db.plan];
  const r = db.resources;
  const s = statusOf(db.status);
  return (
    <div className="split">
      <div>
        {db.status === 'failed' && (
          <Banner tone="bad" title="Provisioning failed">{db.status_reason || 'The database could not be created.'} Delete this database and create a new one.</Banner>
        )}
        {db.status === 'update_failed' && (
          <Banner tone="warn" title="The update did not apply">
            {db.status_reason || 'The change could not be applied.'} Values shown here are the requested ones. Adjust them in Configuration and apply again.
          </Banner>
        )}
        {db.status === 'delete_failed' && (
          <Banner tone="bad" title="Deletion failed">{db.status_reason || 'Some resources could not be removed.'} Retry from Settings.</Banner>
        )}
        {s.busy && <Progress status={db.status} />}

        <section className="section">
          <h2>Resources</h2>
          <p className="lede">{plan ? `Allocated on the ${plan.label} plan, shown against that plan's limits.` : 'Allocated resources.'}</p>
          <Meter name="CPU" value={r.cpu_millicores} max={plan && plan.maxCpu} text={fmtCpu(r.cpu_millicores)} />
          <Meter name="Memory" value={r.memory_mb} max={plan && plan.maxMem} text={fmtMem(r.memory_mb)} />
          <Meter name="Storage" value={r.storage_gb} max={plan && plan.maxStorage} text={fmtGb(r.storage_gb)} />
          <Meter name="Instances" value={db.replicas} max={plan && plan.maxReplicas} text={String(db.replicas)}
                 note={db.replicas === 1 ? 'No standby. Failures and maintenance cause downtime.' : `One primary and ${db.replicas - 1} ${db.replicas === 2 ? 'standby' : 'standbys'}.`} />
        </section>

        <section className="section">
          <h2>Backups</h2>
          {db.backup.enabled ? (
            <p>{describeCron(db.backup.schedule)}. Backups are kept for {db.backup.retention_days} {db.backup.retention_days === 1 ? 'day' : 'days'}.</p>
          ) : (
            <p className="muted">Backups are turned off for this database.</p>
          )}
        </section>

        <section className="section">
          <h2>Storage autoscaling</h2>
          {db.autoscale.enabled
            ? <p>Storage grows automatically as it fills, up to {fmtGb(db.autoscale.max_storage_gb)}.</p>
            : <p className="muted">Off. Storage stays at {fmtGb(r.storage_gb)} until you increase it.</p>}
        </section>
      </div>

      <aside className="rail" aria-label="Details">
        <dl className="facts">
          <div><dt>Engine</dt><dd>{engineLabel(db)}</dd></div>
          <div><dt>Plan</dt><dd>{planLabel(db.plan)}</dd></div>
          <div><dt>Instances</dt><dd>{db.replicas}</dd></div>
          <div><dt>Created</dt><dd title={fullDate(db.created_at)}>{ago(db.created_at)}</dd></div>
          <div><dt>Last change</dt><dd title={fullDate(db.updated_at)}>{ago(db.updated_at)}</dd></div>
          <div><dt>ID</dt><dd className="mono" style={{ fontSize: 12 }}>{db.id}</dd></div>
        </dl>
      </aside>
    </div>
  );
}

function ConnectionTab({ db }) {
  const c = db.connection;
  if (!c) {
    return (
      <div className="empty">
        <h3>Connection details are not ready</h3>
        <p>They appear here once the database is available.</p>
      </div>
    );
  }
  const scheme = db.engine === 'mysql' ? 'mysql' : 'postgresql';
  const uri = `${scheme}://${c.username}@${c.host}:${c.port}/${c.database}`;
  const rows = [['Host', c.host], ['Port', String(c.port)], ['Database', c.database], ['Username', c.username]];
  return (
    <div style={{ maxWidth: 760 }}>
      <section className="section">
        <h2>Endpoint</h2>
        <p className="lede">This address is internal to the platform network. It resolves for workloads running alongside the database.</p>
        <div>
          {rows.map(([k, v]) => (
            <div className="kv" key={k}>
              <span className="k">{k}</span>
              <span className="v mono">{v}</span>
              <CopyButton text={v} label={`Copy ${k.toLowerCase()}`} />
            </div>
          ))}
        </div>
      </section>
      <section className="section">
        <h2>Connection string</h2>
        <p className="lede">Add the password when you use it.</p>
        <div className="codebox"><code className="mono">{uri}</code><CopyButton text={uri} label="Copy connection string" /></div>
      </section>
      <section className="section">
        <h2>Password</h2>
        <p className="muted">The password is held in the platform's secret store and is not shown in this console.</p>
      </section>
    </div>
  );
}

function SliderField({ label, value, min, max, step, format, onChange, error, disabled, hint }) {
  const v = Number.isFinite(value) ? value : min;
  return (
    <Field label={label} error={error} hint={hint}>
      <div className="slider-row">
        <input type="range" min={min} max={max} step={step} value={Math.min(Math.max(v, min), max)}
               disabled={disabled} aria-label={label} onChange={(e) => onChange(Number(e.target.value))} />
        <output className="slider-val mono">{format(v)}</output>
      </div>
    </Field>
  );
}

function ConfigTab({ db, request, refresh, notify }) {
  const base = useMemo(() => ({
    plan: db.plan, cpu: db.resources.cpu_millicores, mem: db.resources.memory_mb,
    storage: db.resources.storage_gb, replicas: db.replicas,
  }), [db.plan, db.resources.cpu_millicores, db.resources.memory_mb, db.resources.storage_gb, db.replicas]);
  const baseKey = JSON.stringify(base);

  const [draft, setDraft] = useState(base);
  const prevKey = useRef(baseKey);
  useEffect(() => {
    if (prevKey.current !== baseKey) {
      // The saved values changed (our update landed). Adopt them unless the user is mid-edit.
      setDraft((d) => (JSON.stringify(d) === prevKey.current ? base : d));
      prevKey.current = baseKey;
    }
  }, [baseKey]);

  const [errs, setErrs] = useState({});
  const [confirming, setConfirming] = useState(false);
  const [busy, setBusy] = useState(false);

  const editable = db.status === 'ready' || db.status === 'update_failed';
  const plan = PLANS[draft.plan] || PLANS.small;

  const changes = [];
  if (draft.plan !== base.plan) changes.push({ field: 'Plan', from: planLabel(base.plan), to: planLabel(draft.plan) });
  if (draft.cpu !== base.cpu) changes.push({ field: 'CPU', from: fmtCpu(base.cpu), to: fmtCpu(draft.cpu) });
  if (draft.mem !== base.mem) changes.push({ field: 'Memory', from: fmtMem(base.mem), to: fmtMem(draft.mem) });
  if (draft.storage !== base.storage) changes.push({ field: 'Storage', from: fmtGb(base.storage), to: fmtGb(draft.storage) });
  if (draft.replicas !== base.replicas) changes.push({ field: 'Instances', from: String(base.replicas), to: String(draft.replicas) });

  const storageInvalid = !Number.isFinite(draft.storage) || draft.storage < base.storage || draft.storage > plan.maxStorage;
  const restarts = draft.cpu !== base.cpu || draft.mem !== base.mem || draft.plan !== base.plan;

  const pickPlan = (key) => {
    const p = PLANS[key];
    setDraft((d) => ({ ...d, plan: key, cpu: p.cpu, mem: p.mem, replicas: Math.min(d.replicas, p.maxReplicas) }));
    setErrs({});
  };

  const apply = async () => {
    const body = {};
    if (draft.plan !== base.plan) {
      // A plan change resets CPU and memory on the server, so send ours explicitly.
      body.plan = draft.plan; body.cpu_millicores = draft.cpu; body.memory_mb = draft.mem;
    } else {
      if (draft.cpu !== base.cpu) body.cpu_millicores = draft.cpu;
      if (draft.mem !== base.mem) body.memory_mb = draft.mem;
    }
    if (draft.storage !== base.storage) body.storage_gb = draft.storage;
    if (draft.replicas !== base.replicas) body.replicas = draft.replicas;

    setBusy(true); setErrs({});
    try {
      const res = await request('/databases/' + db.id, { method: 'PATCH', body });
      notify(res && res.status === 'update_pending' ? 'Changes queued. The database stays online while they apply.' : 'Nothing to change.', 'success');
      setConfirming(false);
      await refresh();
    } catch (err) {
      setConfirming(false);
      if (err.status === 400 && Object.keys(err.fields).length) setErrs(err.fields);
      else notify(err.message, 'error');
    } finally { setBusy(false); }
  };

  const known = ['plan', 'cpu_millicores', 'memory_mb', 'storage_gb', 'replicas'];
  const unmapped = Object.entries(errs).filter(([k]) => !known.includes(k));

  return (
    <div style={{ maxWidth: 760 }}>
      {!editable && (
        <Banner tone="info" title="Configuration is locked">
          {statusOf(db.status).busy ? 'Another operation is in progress. You can change the configuration when it finishes.' : 'This database cannot be changed in its current state.'}
        </Banner>
      )}
      {unmapped.length > 0 && <Banner tone="bad" title="The request was rejected">{unmapped.map(([k, v]) => `${k}: ${v}`).join('. ')}</Banner>}

      <section className="section">
        <h2>Plan</h2>
        <p className="lede">Changing the plan resets CPU and memory to that plan's defaults. Storage is never reduced.</p>
        <fieldset disabled={!editable} style={{ border: 0, padding: 0, margin: 0, minWidth: 0 }}>
          <PlanPicker value={draft.plan} onChange={pickPlan} />
        </fieldset>
        {errs.plan && <p className="field-err" role="alert" style={{ marginTop: 8 }}>{errs.plan}</p>}
      </section>

      <section className="section">
        <h2>Resources</h2>
        <p className="lede">Limits shown are for the {plan.label} plan.</p>
        <div style={{ display: 'grid', gap: 22 }}>
          <SliderField label="CPU" value={draft.cpu} min={MIN_CPU} max={plan.maxCpu} step={250} format={fmtCpu} disabled={!editable}
                       error={errs.cpu_millicores} onChange={(v) => setDraft((d) => ({ ...d, cpu: v }))} />
          <SliderField label="Memory" value={draft.mem} min={MIN_MEM} max={plan.maxMem} step={256} format={fmtMem} disabled={!editable}
                       error={errs.memory_mb} onChange={(v) => setDraft((d) => ({ ...d, mem: v }))} />
          <div className="row2">
            <Field label="Storage" htmlFor="c-storage" error={errs.storage_gb || (storageInvalid ? `Enter ${base.storage} to ${plan.maxStorage} GB. Storage cannot shrink.` : undefined)}
                   hint={`Currently ${base.storage} GB. Storage can only increase.`}>
              <div className="input-affix">
                <input id="c-storage" type="number" className="input" min={base.storage} max={plan.maxStorage} disabled={!editable}
                       value={Number.isFinite(draft.storage) ? draft.storage : ''}
                       onChange={(e) => setDraft((d) => ({ ...d, storage: e.target.value === '' ? NaN : Number(e.target.value) }))} />
                <span>GB</span>
              </div>
            </Field>
            <Field label="Instances" error={errs.replicas}>
              <Stepper value={draft.replicas} min={1} max={plan.maxReplicas} label="instances"
                       onChange={(v) => !editable || setDraft((d) => ({ ...d, replicas: v }))} />
            </Field>
          </div>
        </div>
      </section>

      {restarts && editable && (
        <Banner tone="warn" title="This change restarts the database">
          Changing CPU or memory rolls through each instance.{base.replicas === 1 ? ' With a single instance, the database is unavailable for a short time while it restarts.' : ' Standbys restart first, then the primary fails over, so connections drop briefly.'}
        </Banner>
      )}

      <div className="form-actions">
        <button className="btn btn-primary" disabled={!editable || changes.length === 0 || storageInvalid || busy} onClick={() => setConfirming(true)}>Review changes</button>
        <button className="btn" disabled={changes.length === 0 || busy} onClick={() => { setDraft(base); setErrs({}); }}>Discard</button>
      </div>

      {confirming && (
        <Modal title="Apply changes" onClose={() => !busy && setConfirming(false)}
          footer={<>
            <button className="btn" onClick={() => setConfirming(false)} disabled={busy}>Cancel</button>
            <button className="btn btn-primary" onClick={apply} disabled={busy}>{busy && <Icon name="loader" />}Apply changes</button>
          </>}>
          <p>These changes apply to <strong>{db.name}</strong>:</p>
          <ul className="change-list">
            {changes.map((c) => <li key={c.field}><span>{c.field}</span><span><span className="from">{c.from}</span>{c.to}</span></li>)}
          </ul>
          {restarts && <p className="muted">The database restarts to apply CPU and memory changes.</p>}
        </Modal>
      )}
    </div>
  );
}

function SettingsTab({ db, request, refresh, notify }) {
  const [open, setOpen] = useState(false);
  const [typed, setTyped] = useState('');
  const [busy, setBusy] = useState(false);

  const inProgress = db.status === 'provisioning' || db.status === 'updating';
  const deleting = db.status === 'delete_pending' || db.status === 'deleting';
  const retry = db.status === 'delete_failed';

  const remove = async () => {
    setBusy(true);
    try {
      await request('/databases/' + db.id, { method: 'DELETE' });
      notify(`Deleting ${db.name}.`, 'info');
      setOpen(false); setTyped('');
      await refresh();
    } catch (err) { notify(err.message, 'error'); }
    finally { setBusy(false); }
  };

  return (
    <div style={{ maxWidth: 760 }}>
      <section className="section">
        <h2>Delete database</h2>
        <div className="danger">
          <div>
            <h3>{retry ? 'Retry deletion' : 'Delete this database'}</h3>
            <p>
              {deleting ? 'Deletion is in progress. The database disappears from the list when it finishes.'
                : inProgress ? 'Another operation is running. You can delete the database when it finishes.'
                : 'Removes the database and its data. Existing backups are not removed. This cannot be undone.'}
            </p>
          </div>
          <button className="btn btn-danger" disabled={inProgress || deleting} onClick={() => setOpen(true)}>
            <Icon name="trash" />{retry ? 'Retry deletion' : 'Delete database'}
          </button>
        </div>
      </section>

      {open && (
        <Modal title={retry ? 'Retry deletion' : 'Delete database'} onClose={() => !busy && setOpen(false)}
          footer={<>
            <button className="btn" onClick={() => setOpen(false)} disabled={busy}>Cancel</button>
            <button className="btn btn-danger" disabled={typed !== db.name || busy} onClick={remove}>{busy && <Icon name="loader" />}Delete database</button>
          </>}>
          <p>This permanently deletes <strong>{db.name}</strong> and its data.</p>
          <Field label={<>Type <span className="mono">{db.name}</span> to confirm</>} htmlFor="d-confirm">
            <input id="d-confirm" className="input mono" value={typed} onChange={(e) => setTyped(e.target.value)} autoFocus autoComplete="off" />
          </Field>
        </Modal>
      )}
    </div>
  );
}

function DetailPage({ id, items, loaded, request, refresh, notify }) {
  const db = items.find((d) => d.id === id);
  const [tab, setTab] = useState('overview');
  const seen = useRef(false);

  useEffect(() => {
    if (db) { seen.current = true; return; }
    if (loaded && seen.current) { notify('Database deleted.', 'success'); go('#/databases'); }
  }, [db, loaded]);

  if (!loaded) {
    return <><PageHead crumbs={[{ label: 'Databases', href: '#/databases' }, { label: 'Loading' }]} title=""><span className="skel" style={{ width: 220, height: 26 }} /></PageHead></>;
  }
  if (!db) {
    return (
      <div className="empty">
        <h3>Database not found</h3>
        <p>It may have been deleted, or it belongs to a different owner.</p>
        <a className="btn btn-primary" href="#/databases">Back to databases</a>
      </div>
    );
  }

  const tabs = [['overview', 'Overview'], ['connection', 'Connection'], ['config', 'Configuration'], ['settings', 'Settings']];
  return (
    <>
      <PageHead crumbs={[{ label: 'Databases', href: '#/databases' }, { label: db.name }]}>
        <div className="title-row"><h1>{db.name}</h1><StatusBadge status={db.status} /></div>
        <div className="id-row"><span className="mono">{db.id}</span><CopyButton text={db.id} label="Copy ID" /></div>
      </PageHead>
      <div className="tabs" role="tablist">
        {tabs.map(([key, label]) => (
          <button key={key} role="tab" aria-selected={tab === key} onClick={() => setTab(key)}>{label}</button>
        ))}
      </div>
      {tab === 'overview' && <OverviewTab db={db} />}
      {tab === 'connection' && <ConnectionTab db={db} />}
      {tab === 'config' && <ConfigTab db={db} request={request} refresh={refresh} notify={notify} />}
      {tab === 'settings' && <SettingsTab db={db} request={request} refresh={refresh} notify={notify} />}
    </>
  );
}

/* =====================================================================
   App
   ===================================================================== */
function App() {
  const [apiBase, setApiBase] = useStored('console.apiBase', DEFAULT_API);
  const [owner, setOwner] = useStored('console.owner', 'org-engineering-01');
  const [theme, setTheme] = useStored('console.theme', document.documentElement.dataset.theme || 'light');
  const [showSettings, setShowSettings] = useState(false);
  const route = useRoute();
  const { items: toasts, notify, dismiss } = useToasts();

  const request = useMemo(() => makeRequest(apiBase, owner), [apiBase, owner]);
  const { items, loaded, error, refresh } = useDatabases(request);

  useEffect(() => { document.documentElement.dataset.theme = theme; }, [theme]);
  useEffect(() => { document.title = BRAND.name + ' databases'; }, []);

  const connection = !loaded ? 'pending' : error && error.status === 0 ? 'down' : 'ok';

  return (
    <>
      <TopBar connection={connection} theme={theme} onTheme={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              owner={owner} onSettings={() => setShowSettings(true)} />
      <main className="container">
        {route.name === 'list' && <ListPage items={items} loaded={loaded} error={error} onRefresh={refresh} />}
        {route.name === 'new' && <CreatePage request={request} refresh={refresh} notify={notify} />}
        {route.name === 'detail' && <DetailPage key={route.id} id={route.id} items={items} loaded={loaded} request={request} refresh={refresh} notify={notify} />}
      </main>

      {showSettings && (
        <SettingsModal apiBase={apiBase} owner={owner} onClose={() => setShowSettings(false)}
          onSave={(b, o) => { setApiBase(b); setOwner(o); setShowSettings(false); }} />
      )}

      <div className="toasts" aria-live="polite">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type}`}>
            <p>{t.msg}</p>
            <button onClick={() => dismiss(t.id)} aria-label="Dismiss"><Icon name="x" size={14} /></button>
          </div>
        ))}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
